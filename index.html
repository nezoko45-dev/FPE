<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.166.1/build/three.module.js';

const scene=new THREE.Scene();const camera=new THREE.PerspectiveCamera(76,innerWidth/innerHeight,.1,260);camera.rotation.order='YXZ';

const hemi=new THREE.HemisphereLight(0xe8f1ff,0x514638,1.9);scene.add(hemi);const sun=new THREE.DirectionalLight(0xffffff,2.1);sun.position.set(18,32,12);scene.add(sun);
const DAY=150,NIGHT=480,TRANS=12;let phaseTime=0,nightMix=0,started=false,dead=false,hp=100,papers=0,oreos=0,elapsed=0,lastAttack=-99;
const daySky=new THREE.Color(0x9ba8b9),nightSky=new THREE.Color(0x101323),sky=new THREE.Color();scene.background=daySky.clone();
// No fog, no cycle-driven visibility changes, no scene rebuild during transitions.

const floorMat=mat(0xb7b3a9),wallMat=mat(0xd8d3c7),trimMat=mat(0x68646a),deskMat=mat(0x76513a),paperMat=mat(0xf5edcf),oreoMat=mat(0x30251f),creamMat=mat(0xe8dfd2);

function box(x,y,z,w,h,d,m,solid=true){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=false;o.receiveShadow=false;scene.add(o);if(solid){obstacles.push(new THREE.Box3().setFromObject(o));rayMeshes.push(o)}return o}

function schoolTile(x,z){box(x,-.2,z,10,.4,10,floorMat,false);box(x,3.25,z,10,.18,10,wallMat,false); // solid school roof
// Open room connections: no overlapping tile-boundary walls that cage the player.
if(z===-30)wallBox(x,1.5,z-4.9,10,3,.2);
if(x===-30)wallBox(x-4.9,1.5,z,.2,3,10);

for(let i=0;i<2;i++){box(x+(i?2:-2),.55,z+(i?1:-1),1.6,.9,1,deskMat);box(x+(i?2:-2),1.03,z+(i?1:-1),1.65,.08,1.05,trimMat)}
const fixture=new THREE.Mesh(new THREE.BoxGeometry(1.4,.07,.3),mat(0xfff1c3));fixture.position.set(x,2.85,z);scene.add(fixture);lights.push({fixture});
}
const generatedTiles=new Set();
function addTile(x,z){const key=x+','+z;if(generatedTiles.has(key)||generatedTiles.size>=100)return;generatedTiles.add(key);schoolTile(x,z)}
for(let x=-30;x<=30;x+=10)for(let z=-30;z<=30;z+=10)addTile(x,z);
function expandSchool(){const px=Math.round(player.pos.x/10)*10,pz=Math.round(player.pos.z/10)*10;for(let x=px-30;x<=px+30;x+=10)for(let z=pz-30;z<=pz+30;z+=10)addTile(x,z)}
box(0,-.45,0,100,.5,100,mat(0x424a43),false);

const player={pos:new THREE.Vector3(0,0,0),yaw:0,pitch:0};camera.position.set(0,1.65,0);
const loader=new GLTFLoader();const assets={circle:'fundamental_paper_education_-_miss_circles.glb',thavel:'fundamental_paper_education_-_miss_thavel.glb',bloomie:'fundamental_paper_education_-_miss_bloomie.glb'};
function makeSurvivor(i){const g=new THREE.Group(),skin=mat(0xe0b99b),shirt=mat([0x3e78a8,0x8c4b82,0x4c9568,0xb47736][i]),pants=mat(0x303747);const part=(geo,m,x,y,z)=>{const o=new THREE.Mesh(geo,m);o.position.set(x,y,z);g.add(o);return o};part(new THREE.SphereGeometry(.22,10,8),skin,0,1.62,0);part(new THREE.SphereGeometry(.23,10,8),mat(0x34251e),0,1.78,-.025);part(new THREE.BoxGeometry(.48,.62,.25),shirt,0,1.12,0);const arms=[part(new THREE.BoxGeometry(.16,.55,.18),skin,-.32,1.12,0),part(new THREE.BoxGeometry(.16,.55,.18),skin,.32,1.12,0)],legs=[part(new THREE.BoxGeometry(.19,.55,.2),pants,-.13,.48,0),part(new THREE.BoxGeometry(.19,.55,.2),pants,.13,.48,0)];g.position.set((i-1.5)*3,0,7+Math.random()*4);scene.add(g);return {root:g,arms,legs,hp:100,dead:false,respawn:0,target:null,phase:Math.random()*6}}
for(let i=0;i<4;i++)survivors.push(makeSurvivor(i));
function spawnItem(kind,x,z,save=true){if(save)initialItems.push({kind,x,z});const mesh=new THREE.Group();if(kind==='paper'){const sheet=new THREE.Mesh(new THREE.BoxGeometry(.42,.025,.32),paperMat);sheet.rotation.y=Math.random()*Math.PI;mesh.add(sheet);const fold=new THREE.Mesh(new THREE.BoxGeometry(.09,.028,.09),mat(0xffffff));fold.position.set(.15,.018,-.1);mesh.add(fold);for(let i=0;i<3;i++){const line=new THREE.Mesh(new THREE.BoxGeometry(.2,.006,.012),mat(0x999999));line.position.set(0,.018,(i-1)*.055);mesh.add(line)}}else{const a=new THREE.Mesh(new THREE.CylinderGeometry(.24,.24,.075,24),oreoMat),cream=new THREE.Mesh(new THREE.CylinderGeometry(.205,.205,.035,24),creamMat),b=new THREE.Mesh(new THREE.CylinderGeometry(.24,.24,.075,24),oreoMat);a.position.y=.055;cream.position.y=0;b.position.y=-.055;mesh.add(a,cream,b);for(let n=0;n<8;n++){const dot=new THREE.Mesh(new THREE.SphereGeometry(.018,6,5),mat(0x17110f));dot.position.set(Math.cos(n*Math.PI/4)*.13,.095,Math.sin(n*Math.PI/4)*.13);mesh.add(dot)}}mesh.position.set(x,.18,z);scene.add(mesh);items.push({kind,mesh})}
for(let i=0;i<38;i++)spawnItem(Math.random()<.7?'paper':'oreo',Math.random()*56-28,Math.random()*56-28);
function loadTeacher(key){loader.load(assets[key],g=>{const root=g.scene;root.scale.setScalar(key==='circle'?1.15:1);root.position.set(key==='circle'?0:-12,0,key==='circle'?-15:-12);scene.add(root);const gizmos=[];for(let n=0;n<8;n++){const geo=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(),new THREE.Vector3(0,0,1)]);const line=new THREE.Line(geo,new THREE.LineBasicMaterial({color:0x33ff77}));line.frustumCulled=false;scene.add(line);gizmos.push(line)}const groundGeo=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(),new THREE.Vector3(0,-1,0)]);const groundLine=new THREE.Line(groundGeo,new THREE.LineBasicMaterial({color:0xffff33}));groundLine.frustumCulled=false;scene.add(groundLine);gizmos.push(groundLine);const t={key,root,gizmos,mixer:g.animations.length?new THREE.AnimationMixer(root):null,clips:g.animations,home:root.position.clone(),speed:key==='circle'?3.8:3.3,attackAt:0,lastDamageAt:-999,ray:new THREE.Raycaster(),stuck:0,previous:root.position.clone(),active:null};teachers.push(t);teacherAnim(t,'idle')},undefined,e=>console.warn('Teacher model failed',key,e))}
loadTeacher('circle');loadTeacher('thavel');loadTeacher('bloomie');
function teacherAnim(t,kind){if(!t||!t.mixer||!t.clips?.length)return;const patterns=kind==='attack'?['attack','hit','slap']:kind==='run'?['run','sprint']:kind==='walk'?['walk','move']:['idle','stand'];let clip=t.clips.find(a=>patterns.some(p=>a.name.toLowerCase().includes(p)));if(!clip)clip=t.clips[0];if(t.active===clip)return;t.mixer.stopAllAction();const action=t.mixer.clipAction(clip);action.reset().fadeIn(.18).play();t.active=clip;}
// Expose animation controller on window so stale/isolated module callers can resolve it.
window.teacherAnim=teacherAnim;
let showRayGizmos=false;function toggleRays(){showRayGizmos=!showRayGizmos;document.querySelector('#rays').textContent='Teacher Rays: '+(showRayGizmos?'ON':'OFF')+' (R)';teachers.forEach(t=>t.gizmos?.forEach(g=>g.visible=showRayGizmos))}document.querySelector('#rays').onclick=toggleRays;const keys={};addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='KeyE')attack();if(e.code==='KeyR'||e.code==='KeyG')toggleRays()});addEventListener('keyup',e=>keys[e.code]=false);
let locked=false;renderer.domElement.addEventListener('click',()=>{if(started)renderer.domElement.requestPointerLock()});document.addEventListener('pointerlockchange',()=>locked=document.pointerLockElement===renderer.domElement);
document.addEventListener('mousemove',e=>{if(!locked||!started)return;player.yaw-=e.movementX*.0022;player.pitch-=e.movementY*.002;player.pitch=Math.max(-1.35,Math.min(1.35,player.pitch));camera.rotation.set(player.pitch,player.yaw,0)});
function attack(){if(!started||dead||elapsed-lastAttack<1)return;lastAttack=elapsed;for(const t of teachers){if(t.root.position.distanceTo(player.pos)<3.2){t.attackAt=elapsed+2.2;t.root.userData.stagger=elapsed+1.4}}}
function collides(pos){const p=new THREE.Box3(new THREE.Vector3(pos.x-.38,.05,pos.z-.38),new THREE.Vector3(pos.x+.38,1.8,pos.z+.38));for(let i=0;i<obstacles.length;i++){const b=obstacles[i];if(b.min.x>p.max.x+2||b.max.x<p.min.x-2||b.min.z>p.max.z+2||b.max.z<p.min.z-2)continue;if(b.intersectsBox(p))return true}return false}
function nearbyRayMeshes(pos,radius=12){const r2=radius*radius;return rayMeshes.filter(o=>{const dx=o.position.x-pos.x,dz=o.position.z-pos.z;return dx*dx+dz*dz<r2})
function navStep(pos,target,dt,speed,ray){const dir=target.clone().sub(pos).setY(0);if(dir.lengthSq()<.04)return false;dir.normalize();const nearby=nearbyRayMeshes(pos,6);const origin=pos.clone().add(new THREE.Vector3(0,.8,0));ray.set(origin,dir);ray.far=2.1;const blocked=ray.intersectObjects(nearby,false).length>0;let move=dir;if(blocked){const left=new THREE.Vector3(-dir.z,0,dir.x),right=left.clone().negate(),clear=v=>{ray.set(origin,v);ray.far=2;return !ray.intersectObjects(nearby,false).length};move=clear(left)?left:clear(right)?right:dir.clone().negate()}const q=pos.clone().add(move.multiplyScalar(speed*dt));if(!collides(q)){pos.copy(q);return true}for(const v of [new THREE.Vector3(-dir.z,0,dir.x),new THREE.Vector3(dir.z,0,-dir.x)]){const side=pos.clone().add(v.multiplyScalar(speed*dt));if(!collides(side)){pos.copy(side);return true}}return false}

const raycaster=new THREE.Raycaster();
function stepTeacher(t,dt){const p=t.root.position;if(phaseTime<DAY){const toHome=t.home.clone().sub(p).setY(0);if(toHome.length()>.65){navStep(p,t.home,dt,t.speed,t.ray);t.root.rotation.y=Math.atan2(toHome.x,toHome.z);teacherAnim(t,'walk')}else teacherAnim(t,'idle');return}if(elapsed<(t.root.userData.stagger||0)){teacherAnim(t,'attack');return;}
let target=player.pos,nearest=player.pos.distanceTo(p);for(const s of survivors)if(!s.dead){let d=s.root.position.distanceTo(p);if(d<nearest){nearest=d;target=s.root.position}}
if(nearest>42){target=t.home;nearest=p.distanceTo(target)}
const dir=target.clone().sub(p).setY(0);if(dir.length()<.01)return;dir.normalize();
const origin=p.clone().add(new THREE.Vector3(0,.9,0));const localMeshes=nearbyRayMeshes(p,5);t.ray.set(origin,dir);t.ray.far=2.4;const hit=t.ray.intersectObjects(localMeshes,false)[0];
let move=dir;if(hit){const side=new THREE.Vector3(-dir.z,0,dir.x);const opts=[side,side.clone().negate(),dir.clone().negate()];move=opts.find(v=>{t.ray.set(origin,v);t.ray.far=2.3;return !t.ray.intersectObjects(localMeshes,false).length})||side}
const speed=t.speed*(nearest<2?0.15:1);const next=p.clone().add(move.multiplyScalar(speed*dt));if(!collides(next))p.copy(next);else{const sidestep=new THREE.Vector3(-dir.z,0,dir.x);for(const sign of [1,-1]){const q=p.clone().add(sidestep.clone().multiplyScalar(sign*speed*dt));if(!collides(q)){p.copy(q);break}}}
t.root.rotation.y=Math.atan2(move.x,move.z);teacherAnim(t,nearest<2?'attack':nearest<18?'run':'walk');
if(nearest<1.7&&elapsed-t.attackAt>1.8){t.attackAt=elapsed;teacherAnim(t,'attack');if(elapsed-t.lastDamageAt>=3){t.lastDamageAt=elapsed;if(!dead&&target===player.pos){hp=Math.max(0,hp-35);if(hp===0){dead=true;document.querySelector('#msg').textContent='YOU WERE CAUGHT — press NEW GAME'}}else{const s=survivors.find(a=>a.root.position===target);if(s){s.hp-=35;if(s.hp<=0){s.dead=true;s.respawn=elapsed+8;s.root.visible=false}}}}}
}
function obstaclesMeshes(){return rayMeshes}
const rayDirs=Array.from({length:8},(_,i)=>new THREE.Vector3(Math.cos(i*Math.PI/4),0,Math.sin(i*Math.PI/4)));

function updateTeacherGizmos(t){if(!t.gizmos)return;t.gizmos.forEach(g=>g.visible=showRayGizmos);const p=t.root.position,origin=p.clone().add(new THREE.Vector3(0,.9,0));const rayTargets=obstaclesMeshes();if(!t.rayAnchors)t.rayAnchors=Array.from({length:8},(_,i)=>({angle:i*Math.PI/4,pos:new THREE.Vector3(p.x+Math.cos(i*Math.PI/4)*4,0,p.z+Math.sin(i*Math.PI/4)*4)}));for(let i=0;i<8;i++){const anchor=t.rayAnchors[i];if(Math.hypot(anchor.pos.x-p.x,anchor.pos.z-p.z)>9.8){anchor.angle=Math.random()*Math.PI*2;const radius=3+Math.random()*5.5;anchor.pos.set(p.x+Math.cos(anchor.angle)*radius,0,p.z+Math.sin(anchor.angle)*radius)}const delta=new THREE.Vector3(anchor.pos.x-p.x,0,anchor.pos.z-p.z),distance=delta.length(),d=distance>.01?delta.normalize():rayDirs[i];t.ray.set(origin,d);t.ray.far=Math.min(9,distance||9);const hit=t.ray.intersectObjects(rayTargets,false)[0];const end=hit?hit.point:origin.clone().add(d.clone().multiplyScalar(t.ray.far));const line=t.gizmos[i];line.visible=showRayGizmos;line.material.color.set(hit?0xff3333:0x33ff77);line.geometry.setFromPoints([origin,end])}const down=t.gizmos[8];down.visible=showRayGizmos;down.geometry.setFromPoints([origin,origin.clone().add(new THREE.Vector3(0,-9,0))])}

function update(dt){if(!started)return;elapsed+=dt;phaseTime=(phaseTime+dt)%(DAY+NIGHT);const blend=phaseTime<DAY?0:1;let trans=0;if(phaseTime<TRANS)trans=.5-phaseTime/(TRANS*2);else if(phaseTime>DAY-TRANS&&phaseTime<DAY+TRANS)trans=(phaseTime-(DAY-TRANS))/(TRANS*2);else if(phaseTime>DAY+NIGHT-TRANS)trans=1-(phaseTime-(DAY+NIGHT-TRANS))/(TRANS*2);nightMix=THREE.MathUtils.smoothstep(trans,0,1);sky.copy(daySky).lerp(nightSky,nightMix);scene.background.copy(sky);hemi.intensity=THREE.MathUtils.lerp(1.9,.85,nightMix);sun.intensity=THREE.MathUtils.lerp(2.1,.25,nightMix);sun.position.y=THREE.MathUtils.lerp(32,12,nightMix);lights.forEach(l=>{l.fixture.visible=true});
if(!dead){const f=(keys.KeyW?1:0)-(keys.KeyS?1:0),s=(keys.KeyD?1:0)-(keys.KeyA?1:0);const d=new THREE.Vector3(s,0,-f).applyAxisAngle(new THREE.Vector3(0,1,0),player.yaw);if(d.length())d.normalize().multiplyScalar((keys.ShiftLeft?8:5)*dt);const next=player.pos.clone().add(d);if(!collides(next))player.pos.copy(next);camera.position.set(player.pos.x,1.65,player.pos.z);camera.rotation.set(player.pitch,player.yaw,0)}
expandSchool();for(const t of teachers){t.mixer?.update(dt);stepTeacher(t,dt);updateTeacherGizmos(t)}
for(const s of survivors){if(s.dead){if(elapsed>s.respawn){s.dead=false;s.hp=100;s.root.visible=true;s.root.position.set(Math.random()*12-6,0,Math.random()*12+8)}continue}let target=null,best=Infinity;for(const it of items){const d=it.mesh.position.distanceTo(s.root.position);if(d<best&&d<24){best=d;target=it}}if(target){const delta=target.mesh.position.clone().sub(s.root.position).setY(0);if(delta.length()<.75){scene.remove(target.mesh);items.splice(items.indexOf(target),1);if(target.kind==='paper')papers++;else oreos++}else navStep(s.root.position,target.mesh.position,dt,2.4,raycaster)}s.phase+=dt*5;const swing=Math.sin(s.phase)*.55;s.legs[0].rotation.x=swing;s.legs[1].rotation.x=-swing;s.arms[0].rotation.x=-swing*.7;s.arms[1].rotation.x=swing*.7;s.root.position.y=Math.abs(Math.sin(s.phase))*.045}
for(const it of items){it.mesh.rotation.y+=dt*.7}
document.querySelector('#hp').textContent=hp;document.querySelector('#papers').textContent=papers;document.querySelector('#oreos').textContent=oreos;document.querySelector('#phase').textContent=phaseTime<DAY?'DAY':'NIGHT';const remain=phaseTime<DAY?DAY-phaseTime:DAY+NIGHT-phaseTime;document.querySelector('#timer').textContent=Math.floor(remain/60)+':'+String(Math.floor(remain%60)).padStart(2,'0')}
function newGame(){started=true;dead=false;hp=100;papers=0;oreos=0;elapsed=0;phaseTime=0;nightMix=0;lastAttack=-99;scene.background.copy(daySky);player.pos.set(0,0,0);player.yaw=0;player.pitch=0;camera.position.set(0,1.65,0);camera.rotation.set(0,0,0);for(const k in keys)keys[k]=false;items.forEach(it=>scene.remove(it.mesh));items.length=0;initialItems.forEach(it=>spawnItem(it.kind,it.x,it.z,false));survivors.forEach((s,i)=>{s.dead=false;s.hp=100;s.root.visible=true;s.root.position.set((i-1.5)*3,0,7+i);s.phase=0});teachers.forEach(t=>{t.root.position.copy(t.home);t.root.userData.stagger=0;t.attackAt=0;t.lastDamageAt=-999;t.previous.copy(t.home);teacherAnim(t,'idle')});document.querySelector('#msg').textContent='';document.querySelector('#start').style.display='none';renderer.domElement.requestPointerLock()}document.querySelector('#play').onclick=newGame;
const clock=new THREE.Clock();let loopFaults=0;function loop(){requestAnimationFrame(loop);try{const dt=Math.min(clock.getDelta(),.05);update(dt);renderer.render(scene,camera);loopFaults=0}catch(err){console.error('FPE frame recovered:',err);if(++loopFaults>10){started=false;document.querySelector('#start').style.display='grid';document.querySelector('#msg').textContent='Game paused after repeated errors. Reload to recover.';loopFaults=0}}}loop();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
