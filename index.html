<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FPE — Rebuilt</title>
<style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#111;color:#fff;font:15px system-ui}canvas{display:block}#hud{position:fixed;z-index:3;top:12px;left:12px;background:#101722dd;border:1px solid #ffffff35;border-radius:10px;padding:12px 16px;min-width:220px;line-height:1.65}#hud b{color:#ffe36a}#msg{color:#ff8c8c}#start{position:fixed;inset:0;z-index:5;display:grid;place-items:center;background:#10131beF}#panel{max-width:560px;padding:32px;background:#202635;border:1px solid #ffffff35;border-radius:16px;text-align:center}button{font:inherit;font-weight:700;padding:12px 24px;border:0;border-radius:9px;background:#f0d65a;color:#181818;cursor:pointer}#hint{opacity:.75;font-size:13px}
</style></head><body>
<div id="hud">FPE: REBUILT<br>Health: <b id="hp">100</b><br>Papers: <b id="papers">0</b> · Oreos: <b id="oreos">0</b><br>Phase: <b id="phase">DAY</b> · <b id="timer">2:30</b><br><span id="msg"></span></div>
<div id="start"><div id="panel"><h1>FUNDAMENTAL PAPER EDUCATION</h1><h2>REBUILT</h2><p>Fresh world architecture · same survival loop</p><p>Collect papers and Oreos. Survive the teachers.</p><button id="play">NEW GAME</button><p id="hint">WASD move · Mouse look · Shift sprint · E attack · Esc release mouse</p></div></div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.166.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.166.1/examples/jsm/"}}

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.166.1/build/three.module.js';
import {GLTFLoader} from 'https://cdn.jsdelivr.net/npm/three@0.166.1/examples/jsm/loaders/GLTFLoader.js';
const scene=new THREE.Scene();const camera=new THREE.PerspectiveCamera(76,innerWidth/innerHeight,.1,260);camera.rotation.order='YXZ';
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.body.appendChild(renderer.domElement);
const hemi=new THREE.HemisphereLight(0xe8f1ff,0x514638,1.9);scene.add(hemi);const sun=new THREE.DirectionalLight(0xffffff,2.1);sun.position.set(18,32,12);scene.add(sun);
const DAY=150,NIGHT=480,TRANS=12;let phaseTime=0,nightMix=0,started=false,dead=false,hp=100,papers=0,oreos=0,elapsed=0,lastAttack=-99;
const daySky=new THREE.Color(0x9ba8b9),nightSky=new THREE.Color(0x101323),sky=new THREE.Color();scene.background=daySky.clone();
// No fog, no cycle-driven visibility changes, no scene rebuild during transitions.
const mat=(color,roughness=.9)=>new THREE.MeshStandardMaterial({color,roughness});
const floorMat=mat(0xb7b3a9),wallMat=mat(0xd8d3c7),trimMat=mat(0x68646a),deskMat=mat(0x76513a),paperMat=mat(0xf5edcf),oreoMat=mat(0x30251f);
const obstacles=[],floors=[],items=[],survivors=[],teachers=[],lights=[];
function box(x,y,z,w,h,d,m,solid=true){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;scene.add(o);if(solid)obstacles.push(new THREE.Box3().setFromObject(o));return o}
function schoolTile(x,z){box(x,-.2,z,10,.4,10,floorMat,false); // walls stop below ceiling; no opaque roof meshes
// Open room connections: no overlapping tile-boundary walls that cage the player.
if(z===-30)box(x,1.5,z-4.9,10,3,.2,wallMat);
if(x===-30)box(x-4.9,1.5,z,.2,3,10,wallMat);
if(x===30)box(x+4.9,1.5,z,.2,3,10,wallMat);
// South perimeter is deliberately open for a reliable exit.
for(let i=0;i<2;i++){box(x+(i?2:-2),.55,z+(i?1:-1),1.6,.9,1,deskMat);box(x+(i?2:-2),1.03,z+(i?1:-1),1.65,.08,1.05,trimMat)}
const fixture=new THREE.Mesh(new THREE.BoxGeometry(1.4,.07,.3),mat(0xfff1c3));fixture.position.set(x,2.85,z);scene.add(fixture);const lamp=new THREE.PointLight(0xffe5a0,1.8,8);lamp.position.set(x,2.55,z);scene.add(lamp);lights.push({fixture,lamp});
}
for(let x=-30;x<=30;x+=10)for(let z=-30;z<=30;z+=10)schoolTile(x,z);
box(0,-.45,0,100,.5,100,mat(0x424a43),false);
// Add more rooms/halls around the playable school perimeter.
for(let x=-50;x<=50;x+=10){box(x,1.5,-40,10,3,.2,wallMat);box(x,1.5,40,10,3,.2,wallMat)}
const player={pos:new THREE.Vector3(0,0,0),yaw:0,pitch:0};camera.position.set(0,1.65,0);
const loader=new GLTFLoader();const assets={circle:'fundamental_paper_education_-_miss_circles.glb',thavel:'fundamental_paper_education_-_miss_thavel.glb',bloomie:'fundamental_paper_education_-_miss_bloomie.glb'};
function makeSurvivor(i){const g=new THREE.Group();const body=new THREE.Mesh(new THREE.CapsuleGeometry(.27,.65,4,8),mat([0xeee5dc,0xc9d8ee,0xe8c9d4,0xd4e8c9][i]));body.position.y=1;g.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(.23,12,10),mat(0xf0d2bd));head.position.y=1.55;g.add(head);g.position.set((i-1.5)*3,0,7+Math.random()*4);scene.add(g);return {root:g,hp:100,dead:false,respawn:0,target:null,phase:Math.random()*6}}
for(let i=0;i<4;i++)survivors.push(makeSurvivor(i));
function spawnItem(kind,x,z){const mesh=new THREE.Mesh(kind==='paper'?new THREE.BoxGeometry(.35,.035,.28):new THREE.CylinderGeometry(.24,.24,.13,16),kind==='paper'?paperMat:oreoMat);mesh.position.set(x,.15,z);mesh.rotation.x=kind==='oreo'?Math.PI/2:0;mesh.castShadow=true;scene.add(mesh);items.push({kind,mesh})}
for(let i=0;i<38;i++)spawnItem(Math.random()<.7?'paper':'oreo',Math.random()*56-28,Math.random()*56-28);
function loadTeacher(key){loader.load(assets[key],g=>{const root=g.scene;root.scale.setScalar(key==='circle'?1.15:1);root.position.set(key==='circle'?0:-12,0,key==='circle'?-15:-12);scene.add(root);teachers.push({key,root,mixer:g.animations.length?new THREE.AnimationMixer(root):null,clips:g.animations,home:root.position.clone(),speed:key==='circle'?3.8:3.3,attackAt:0,ray:new THREE.Raycaster(),stuck:0,previous:root.position.clone()});if(g.animations.length){const m=teachers[teachers.length-1].mixer;const clip=g.animations.find(a=>/walk|run/i.test(a.name))||g.animations[0];m.clipAction(clip).play()}},undefined,e=>console.warn('Teacher model failed',key,e))}
loadTeacher('circle');loadTeacher('thavel');loadTeacher('bloomie');
const keys={};addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='KeyE')attack()});addEventListener('keyup',e=>keys[e.code]=false);
let locked=false;renderer.domElement.addEventListener('click',()=>{if(started)renderer.domElement.requestPointerLock()});document.addEventListener('pointerlockchange',()=>locked=document.pointerLockElement===renderer.domElement);
document.addEventListener('mousemove',e=>{if(!locked||!started)return;player.yaw-=e.movementX*.0022;player.pitch-=e.movementY*.002;player.pitch=Math.max(-1.35,Math.min(1.35,player.pitch));camera.rotation.set(player.pitch,player.yaw,0)});
function attack(){if(!started||dead||elapsed-lastAttack<1)return;lastAttack=elapsed;for(const t of teachers){if(t.root.position.distanceTo(player.pos)<3.2){t.attackAt=elapsed+2.2;t.root.userData.stagger=elapsed+1.4}}}
function collides(pos){const p=new THREE.Box3(new THREE.Vector3(pos.x-.38,.05,pos.z-.38),new THREE.Vector3(pos.x+.38,1.8,pos.z+.38));return obstacles.some(b=>b.intersectsBox(p))}
const raycaster=new THREE.Raycaster();
function stepTeacher(t,dt){const p=t.root.position;if(elapsed<(t.root.userData.stagger||0))return;
let target=player.pos,nearest=player.pos.distanceTo(p);for(const s of survivors)if(!s.dead){let d=s.root.position.distanceTo(p);if(d<nearest){nearest=d;target=s.root.position}}
if(nearest>42){target=t.home;nearest=p.distanceTo(target)}
const dir=target.clone().sub(p).setY(0);if(dir.length()<.01)return;dir.normalize();
const origin=p.clone().add(new THREE.Vector3(0,.9,0));t.ray.set(origin,dir);t.ray.far=2.4;const hit=t.ray.intersectObjects(scene.children,true).find(h=>h.object!==t.root&&!t.root.children.includes(h.object)&&h.object.userData.teacher!==true&&h.object.position.y<3);
let move=dir;if(hit){const side=new THREE.Vector3(-dir.z,0,dir.x);const opts=[side,side.clone().negate(),dir.clone().negate()];move=opts.find(v=>{t.ray.set(origin,v);t.ray.far=2.3;return !t.ray.intersectObjects(obstaclesMeshes(),false).length})||side}
const speed=t.speed*(nearest<2?0.15:1);const next=p.clone().add(move.multiplyScalar(speed*dt));if(!collides(next))p.copy(next);else{const sidestep=new THREE.Vector3(-dir.z,0,dir.x);for(const sign of [1,-1]){const q=p.clone().add(sidestep.clone().multiplyScalar(sign*speed*dt));if(!collides(q)){p.copy(q);break}}}
t.root.rotation.y=Math.atan2(move.x,move.z);
if(nearest<1.7&&elapsed-t.attackAt>1.8){t.attackAt=elapsed;if(!dead&&target===player.pos){hp=Math.max(0,hp-12);if(hp===0){dead=true;document.querySelector('#msg').textContent='YOU WERE CAUGHT — press NEW GAME'}}else{const s=survivors.find(a=>a.root.position===target);if(s){s.hp-=20;if(s.hp<=0){s.dead=true;s.respawn=elapsed+12;s.root.visible=false}}}}
}
function obstaclesMeshes(){return scene.children.filter(o=>o.isMesh&&obstacles.some(b=>b.intersectsBox(new THREE.Box3().setFromObject(o))))}
function update(dt){if(!started)return;elapsed+=dt;phaseTime=(phaseTime+dt)%(DAY+NIGHT);const blend=phaseTime<DAY?0:1;let trans=0;if(phaseTime<TRANS)trans=.5-phaseTime/(TRANS*2);else if(phaseTime>DAY-TRANS&&phaseTime<DAY+TRANS)trans=(phaseTime-(DAY-TRANS))/(TRANS*2);else if(phaseTime>DAY+NIGHT-TRANS)trans=1-(phaseTime-(DAY+NIGHT-TRANS))/(TRANS*2);nightMix=THREE.MathUtils.smoothstep(trans,0,1);sky.copy(daySky).lerp(nightSky,nightMix);scene.background.copy(sky);hemi.intensity=THREE.MathUtils.lerp(1.9,.85,nightMix);sun.intensity=THREE.MathUtils.lerp(2.1,.25,nightMix);sun.position.y=THREE.MathUtils.lerp(32,12,nightMix);lights.forEach(l=>{l.fixture.visible=true;l.lamp.visible=true});
if(!dead){const f=(keys.KeyW?1:0)-(keys.KeyS?1:0),s=(keys.KeyD?1:0)-(keys.KeyA?1:0);const d=new THREE.Vector3(s,0,-f).applyAxisAngle(new THREE.Vector3(0,1,0),player.yaw);if(d.length())d.normalize().multiplyScalar((keys.ShiftLeft?8:5)*dt);const next=player.pos.clone().add(d);if(!collides(next))player.pos.copy(next);camera.position.set(player.pos.x,1.65,player.pos.z);camera.rotation.set(player.pitch,player.yaw,0)}
for(const t of teachers){t.mixer?.update(dt);stepTeacher(t,dt)}
for(const s of survivors){if(s.dead){if(elapsed>s.respawn){s.dead=false;s.hp=100;s.root.visible=true;s.root.position.set(Math.random()*12-6,0,Math.random()*12+8)}continue}let target=items[0];if(target){const delta=target.mesh.position.clone().sub(s.root.position).setY(0);if(delta.length()<.65){scene.remove(target.mesh);items.splice(items.indexOf(target),1);if(target.kind==='paper')papers++;else oreos++;target=null}if(target){delta.normalize().multiplyScalar(2.2*dt);const q=s.root.position.clone().add(delta);if(!collides(q))s.root.position.copy(q)}}s.phase+=dt*5;s.root.position.y=Math.abs(Math.sin(s.phase))*.035}
for(const it of items){it.mesh.rotation.y+=dt*.7}
document.querySelector('#hp').textContent=hp;document.querySelector('#papers').textContent=papers;document.querySelector('#oreos').textContent=oreos;document.querySelector('#phase').textContent=phaseTime<DAY?'DAY':'NIGHT';const remain=phaseTime<DAY?DAY-phaseTime:DAY+NIGHT-phaseTime;document.querySelector('#timer').textContent=Math.floor(remain/60)+':'+String(Math.floor(remain%60)).padStart(2,'0')}
document.querySelector('#play').onclick=()=>{started=true;document.querySelector('#start').style.display='none';renderer.domElement.requestPointerLock();phaseTime=0;nightMix=0;scene.background.copy(daySky);hp=100;dead=false;player.pos.set(0,0,0);player.yaw=0;player.pitch=0};
const clock=new THREE.Clock();function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.05);update(dt);renderer.render(scene,camera)}loop();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
